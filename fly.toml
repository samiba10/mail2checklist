# Fly.io config. Change `app` to a unique name, then see README "Deploy to Fly.io".
app = "mail2checklist"
primary_region = "fra"   # Frankfurt; closest Fly region to Israel

[build]

[env]
  PORT = "8000"
  DB_PATH = "/data/checklists.db"
  GMAIL_TOKEN = "/data/token.json"
  WA_LANG = "he"
  WA_COUNTRY_CODE = "972"
  WA_TEMPLATE = "new_checklist"
  POLL_SECONDS = "180"

[[mounts]]
  source = "m2c_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # the Gmail poller must keep running
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
