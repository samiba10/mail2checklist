# For any VPS / home server:  docker compose up -d --build
# Put a reverse proxy with HTTPS (e.g. Caddy) in front and set BASE_URL in .env.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/checklists.db
      GMAIL_TOKEN: /data/token.json
    ports:
      - "8000:8000"
    volumes:
      - data:/data

volumes:
  data:
