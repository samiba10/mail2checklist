<!doctype html>
<html lang="{{ 'he' if rtl else 'en' }}" dir="{{ 'rtl' if rtl else 'ltr' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ lst.title }}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#6a737d; --line:#e3e6ea; --accent:#128c7e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1214; --card:#181c1f; --fg:#e8eaed; --muted:#9aa0a6; --line:#2a2f33; --accent:#25d366; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .meta { color:var(--muted); font-size:.85rem; margin-bottom:16px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:6px; }
  .bar > i { display:block; height:100%; background:var(--accent); transition:width .2s; }
  .count { font-size:.85rem; color:var(--muted); margin-bottom:16px; }
  ul { list-style:none; padding:0; margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  li + li { border-top:1px solid var(--line); }
  label { display:flex; gap:12px; align-items:flex-start; padding:14px 16px 6px; cursor:pointer; }
  label .t { font-weight:600; }
  .d { display:block; color:var(--muted); font-size:.85rem; margin-top:2px; }
  .calls { display:flex; flex-wrap:wrap; gap:8px; padding-block:0 12px; padding-inline:50px 16px; }
  .calls a { font-size:.85rem; color:var(--accent); text-decoration:none; border:1px solid var(--line);
             border-radius:999px; padding:4px 10px; direction:ltr; }
  input { width:22px; height:22px; accent-color:var(--accent); flex:none; margin:1px 0 0; }
  input:checked + span { text-decoration:line-through; color:var(--muted); }
  li:not(:has(.calls)) label { padding-bottom:14px; }
</style>
</head>
<body>
<main>
  <h1 dir="auto">{{ lst.title }}</h1>
  <div class="meta" dir="auto">{{ lst.sender }}</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="count" id="count"></div>
  <ul>
    {% for it in items %}
    <li><label>
      <input type="checkbox" data-id="{{ it.id }}" {% if it.done %}checked{% endif %}>
      <span dir="auto"><span class="t">{{ it.text }}</span>{% if it.detail %}<span class="d">{{ it.detail }}</span>{% endif %}</span>
    </label>
    {% if it.phones %}<div class="calls">{% for ph in it.phones.split(',') %}<a href="tel:{{ ph|replace('-','') }}">📞 {{ ph }}</a>{% endfor %}</div>{% endif %}
    </li>
    {% endfor %}
  </ul>
</main>
<script>
  const boxes = [...document.querySelectorAll('input[type=checkbox]')];
  function refresh() {
    const done = boxes.filter(b => b.checked).length;
    document.getElementById('count').textContent = {{ 'rtl'|tojson }} === document.dir ? `${done} מתוך ${boxes.length} בוצעו` : `${done} of ${boxes.length} done`;
    document.getElementById('bar').style.width = (boxes.length ? 100 * done / boxes.length : 0) + '%';
  }
  boxes.forEach(b => b.addEventListener('change', async () => {
    refresh();
    try {
      const r = await fetch(`${location.pathname}/items/${b.dataset.id}/toggle`, { method: 'POST' });
      if (!r.ok) throw new Error();
      b.checked = (await r.json()).done;
    } catch { b.checked = !b.checked; alert('Could not save, try again.'); }
    refresh();
  }));
  refresh();
</script>
</body>
</html>
